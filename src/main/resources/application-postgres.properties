# External PostgreSQL connection; localhost is only valid when database runs on the same host.
# DB_JDBC_URL can override the assembled JDBC connection string.
spring.datasource.url=${DB_JDBC_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:${DB_PUERTO:5432}}/${DB_NAME:tracking_psep}}
spring.datasource.username=${DB_USER:tracking_psep_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
