spring.application.name=demo
spring.profiles.active=${SPRING_PROFILE:h2}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=false

# Autenticacion y sesiones
app.auth.failed-attempt-window-minutes=${AUTH_FAILED_ATTEMPT_WINDOW_MINUTES:10}
app.auth.lock-minutes=${AUTH_LOCK_MINUTES:15}
app.auth.refresh-token-days=${AUTH_REFRESH_TOKEN_DAYS:7}
app.auth.password-reset-minutes=${AUTH_PASSWORD_RESET_MINUTES:45}
app.auth.password-reset-url=${AUTH_PASSWORD_RESET_URL:http://localhost:5173/restablecer-password}
app.auth.client-inactivity-minutes=${AUTH_CLIENT_INACTIVITY_MINUTES:30}
app.auth.operational-inactivity-minutes=${AUTH_OPERATIONAL_INACTIVITY_MINUTES:15}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Email configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}