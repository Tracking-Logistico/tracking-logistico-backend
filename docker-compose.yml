services:

  postgres:
    image: postgres:17-alpine
    container_name: sistema_logistica_db
    environment:
      POSTGRES_DB: ${DB_NAME:-logistica_db}
      POSTGRES_USER: ${DB_USER:-logistica_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-logistica_pass}
    ports:
      - "${DB_PUERTO:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: