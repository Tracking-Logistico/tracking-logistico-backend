services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tracking_psep
      POSTGRES_USER: tracking_psep_user
      POSTGRES_PASSWORD: T0Yq9eevXY4A6rWDOIV2MatsKadO9xs7
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_PROFILE: postgres
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tracking_psep
      DB_USER: tracking_psep_user
      DB_PASSWORD: T0Yq9eevXY4A6rWDOIV2MatsKadO9xs7
      CORS_ALLOWED_ORIGIN: http://localhost:5173
      APP_VERIFICATION_URL: http://localhost:5173/verificar
      AUTH_PASSWORD_RESET_URL: http://localhost:5173/restablecer-password
      SWAGGER_ENABLED: "true"
      DBA_API_KEY: dev-dba-key
      MAIL_ENABLED: "true"
      MAIL_LOG_ACTION_LINKS: "true"
      MAIL_PROVIDER: smtp
      MAIL_FROM: no-reply@logistrack.local
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ../tracking-logistico-frontend-main
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
