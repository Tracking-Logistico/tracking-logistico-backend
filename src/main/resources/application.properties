spring.application.name=demo
spring.profiles.active=${SPRING_PROFILE:postgres}
server.address=0.0.0.0
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Public documentation is opt-in in production.
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=false

# Authentication and sessions
app.auth.failed-attempt-window-minutes=${AUTH_FAILED_ATTEMPT_WINDOW_MINUTES:10}
app.auth.lock-minutes=${AUTH_LOCK_MINUTES:15}
app.auth.refresh-token-days=${AUTH_REFRESH_TOKEN_DAYS:7}
app.auth.password-reset-minutes=${AUTH_PASSWORD_RESET_MINUTES:45}
app.auth.password-reset-url=${AUTH_PASSWORD_RESET_URL:http://localhost:5173/restablecer-password}
app.auth.client-inactivity-minutes=${AUTH_CLIENT_INACTIVITY_MINUTES:30}
app.auth.operational-inactivity-minutes=${AUTH_OPERATIONAL_INACTIVITY_MINUTES:15}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.verification-url=${APP_VERIFICATION_URL:https://tracking-logistico-backend.onrender.com/api/v1/clientes/verificar}

# Temporal: correo desactivado. Rehabilitar configurando MAIL_ENABLED=true y un proveedor valido.
# Sin correo, los clientes nuevos se registran activos y la recuperacion por correo devuelve 503.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.provider=${MAIL_PROVIDER:resend}
app.mail.from=${MAIL_FROM:}
app.mail.resend-api-key=${RESEND_API_KEY:}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
